# Workflow: full (QA + DEV + JANITOR)
# All three agents: QA tests, DEV builds, JANITOR maintains.

project: my-project
check_interval: 30

agents:
  - name: QA
    icon: "\U0001F534"
    type: claude
    prompt: prompts/qa.md
    interval: 10
    timeout: 600
    max_restarts: 5
    working_dirs:
      - tests/
      - docs/

  - name: DEV
    icon: "\U0001F535"
    type: claude
    prompt: prompts/dev.md
    interval: 10
    timeout: 600
    max_restarts: 5
    working_dirs:
      - src/

  - name: JANITOR
    icon: "\U0001F7E2"
    type: claude
    prompt: prompts/janitor.md
    interval: 1800
    timeout: 600
    max_restarts: 5
    working_dirs:
      - docs/
      - "*.md"
